<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hammy Hamster Web</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #181818;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 20px;
    }
    h1 { margin-bottom: 10px; }
    .container {
      display: flex;
      gap: 20px;
      margin-top: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .box {
      border: 2px solid #444;
      border-radius: 12px;
      background: #000;
      width: 480px;
      height: 360px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Mirror view */
    }
    img#reaction {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    #status {
      margin-top: 12px;
      font-size: 1.1rem;
      color: #00ffcc;
    }
    button {
      padding: 10px 20px;
      font-size: 1rem;
      border-radius: 8px;
      border: none;
      background: #0070f3;
      color: white;
      cursor: pointer;
    }
    button:hover { background: #005bb5; }
  </style>
</head>
<body>

  <h1>Hammy Hamster Live Web</h1>
  <button id="startBtn">Enable Camera</button>
  <div id="status">Camera not started</div>

  <div class="container">
    <div class="box">
      <video id="webcam" autoplay playsinline></video>
    </div>
    <div class="box">
      <img id="reaction" src="images/poker_face.png" alt="Hamster reaction" />
    </div>
  </div>

  <!-- Load MediaPipe Tasks Vision CDN -->
  <script type="module">
    import { GestureRecognizer, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest";

    const video = document.getElementById("webcam");
    const reactionImg = document.getElementById("reaction");
    const statusText = document.getElementById("status");
    const startBtn = document.getElementById("startBtn");

    let gestureRecognizer;
    let runningMode = "VIDEO";
    let lastVideoTime = -1;

    // Gesture to image mapping (make sure images exist in your images/ folder)
    const gestureImageMap = {
      "Thumb_Up": "images/thumbs_up.png",
      "Thumb_Down": "images/thumbs_down.png",
      "Closed_Fist": "images/lollipop.png",
      "Pointing_Up": "images/nerd.png",
      "Victory": "images/peace.png",
      "ILoveYou": "images/truck.png",
      "None": "images/poker_face.png"
    };

    async function initMediaPipe() {
      statusText.innerText = "Loading MediaPipe models...";
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
      );
      gestureRecognizer = await GestureRecognizer.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task",
          delegate: "GPU"
        },
        runningMode: runningMode,
        numHands: 2
      });
      statusText.innerText = "Model loaded. Click 'Enable Camera' to start.";
    }

    startBtn.addEventListener("click", async () => {
      if (!gestureRecognizer) return;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
        video.srcObject = stream;
        video.addEventListener("loadeddata", predictWebcam);
        startBtn.style.display = "none";
        statusText.innerText = "Running detection...";
      } catch (err) {
        statusText.innerText = "Camera access denied: " + err.message;
      }
    });

    async function predictWebcam() {
      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const results = gestureRecognizer.recognizeForVideo(video, performance.now());

        if (results.gestures.length > 0) {
          const categoryName = results.gestures[0][0].categoryName;
          const score = parseFloat(results.gestures[0][0].score * 100).toFixed(1);
          statusText.innerText = `Gesture: ${categoryName} (${score}%)`;

          if (gestureImageMap[categoryName]) {
            reactionImg.src = gestureImageMap[categoryName];
          }
        } else {
          statusText.innerText = "Gesture: None";
        }
      }
      requestAnimationFrame(predictWebcam);
    }

    initMediaPipe();
  </script>
</body>
</html>
