<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hammy Hamster Web</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: #58a6ff;
    }
    #status {
      font-size: 1rem;
      font-weight: 500;
      color: #3fb950;
      margin-bottom: 16px;
      min-height: 24px;
    }
    .controls {
      margin-bottom: 20px;
    }
    button {
      padding: 10px 22px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid rgba(240, 246, 252, 0.1);
      background: #238636;
      color: #ffffff;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #2ea043;
    }
    .container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 1000px;
      width: 100%;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 460px;
      height: 380px;
    }
    .card-title {
      font-size: 0.9rem;
      color: #8b949e;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .feed-box {
      width: 100%;
      flex: 1;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    img#reaction {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
  </style>
</head>
<body>

  <h1>Hammy Hamster Live Web</h1>
  <div id="status">Loading MediaPipe Models...</div>

  <div class="controls">
    <button id="startBtn" disabled>Starting...</button>
  </div>

  <div class="container">
    <div class="card">
      <div class="card-title">Live Camera Feed</div>
      <div class="feed-box">
        <video id="webcam" autoplay playsinline muted></video>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Reaction Hamster</div>
      <div class="feed-box">
        <img id="reaction" src="images/poker_face.png" alt="Reaction Hamster" />
      </div>
    </div>
  </div>

  <!-- MediaPipe Tasks Vision Bundle -->
  <script type="module">
    import { GestureRecognizer, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

    const video = document.getElementById("webcam");
    const reactionImg = document.getElementById("reaction");
    const statusText = document.getElementById("status");
    const startBtn = document.getElementById("startBtn");

    let gestureRecognizer = null;
    let runningMode = "VIDEO";
    let lastVideoTime = -1;

    // Map detected gestures to matching files in the images folder
    const gestureMap = {
      "Thumb_Up": "images/thumbs_up.png",
      "Thumb_Down": "images/thumbs_down.png",
      "Closed_Fist": "images/lollipop.png",
      "Pointing_Up": "images/nerd.png",
      "Victory": "images/peace.png",
      "ILoveYou": "images/truck.png",
      "Open_Palm": "images/side_eye.png",
      "None": "images/poker_face.png"
    };

    // Fallback handler if a local image file fails to load
    reactionImg.onerror = function() {
      if (!this.src.endsWith(".jpg") && !this.src.endsWith(".jpeg")) {
        // Try .jpg if .png wasn't found
        this.src = this.src.replace(/\.(png|webp)$/, '.jpg');
      } else {
        // Fallback default image
        this.src = "https://cataas.com/cat/says/Hamster?fontSize=40&fontColor=white";
      }
    };

    async function init() {
      try {
        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
        );
        gestureRecognizer = await GestureRecognizer.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task",
            delegate: "GPU"
          },
          runningMode: runningMode,
          numHands: 2
        });

        statusText.innerText = "Model ready. Click below to enable camera.";
        startBtn.disabled = false;
        startBtn.innerText = "Enable Camera";
      } catch (err) {
        statusText.innerText = "Failed to load models: " + err.message;
        statusText.style.color = "#f85149";
      }
    }

    startBtn.addEventListener("click", async () => {
      if (!gestureRecognizer) return;

      try {
        const constraints = {
          video: { width: 640, height: 480, facingMode: "user" }
        };
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        
        video.addEventListener("loadeddata", () => {
          startBtn.style.display = "none";
          statusText.innerText = "Tracking active — make a hand gesture!";
          predictWebcam();
        });
      } catch (err) {
        statusText.innerText = "Camera permission error: " + err.message;
        statusText.style.color = "#f85149";
      }
    });

    async function predictWebcam() {
      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const results = gestureRecognizer.recognizeForVideo(video, performance.now());

        if (results.gestures && results.gestures.length > 0) {
          const gestureName = results.gestures[0][0].categoryName;
          const confidence = (results.gestures[0][0].score * 100).toFixed(0);

          statusText.innerText = `Detected: ${gestureName} (${confidence}%)`;

          if (gestureMap[gestureName]) {
            reactionImg.src = gestureMap[gestureName];
          }
        } else {
          statusText.innerText = "Detected: None (Poker Face)";
          reactionImg.src = gestureMap["None"];
        }
      }
      requestAnimationFrame(predictWebcam);
    }

    init();
  </script>
</body>
</html>
